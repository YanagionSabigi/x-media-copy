<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>X 图文复制与媒体下载</title>
<style>body{width:350px;margin:0;padding:18px;color:#17202a;background:#fff;font:14px/1.55 system-ui,sans-serif}h1{margin:0 0 8px;font-size:18px}h2{font-size:15px;margin:18px 0 6px}p{margin:8px 0}ul{margin:8px 0 14px;padding-left:20px}li{margin:6px 0}small{color:#536471}.job{padding:10px 0;border-top:1px solid #e5e7eb}.job p{margin:3px 0;word-break:break-word}.error{color:#b42318}button{padding:5px 9px;margin:4px 5px 0 0;border:1px solid #aeb8c2;border-radius:6px;background:#f5f8fa;cursor:pointer}button:disabled{opacity:.5;cursor:wait}#jobs{max-height:370px;overflow:auto}#feedback{min-height:18px}</style>
<body>
<h1>X 图文复制与媒体下载</h1>
<p>X 推文底部最右侧会有复制按钮，有以下点击方式：</p>
<ul>
<li>直接点击：复制<strong>贴文、译文、图片与原贴链接</strong>；对带<strong>动图</strong>或<strong>视频</strong>的帖子，下载文件</li>
<li>Alt+点击：不复制译文（适合在 Grok 翻译出错时）</li>
<li>Shift+点击：将图片合成一张，适合将切分图合并发布</li>
</ul>
<p>视频帖子还有 GIF 按钮，两种方式均复制贴文、译文和出处链接，并留一行插入 GIF：</p>
<ul>
<li>直接点击：低采样率制作 GIF 并下载。</li>
<li>Alt+点击：原帧率原采样率制作 GIF 并下载</li>
</ul>
<h2>媒体下载内容：</h2><div id="jobs">正在读取任务…</div><p id="feedback" role="status"></p>
<script src="popup.js"></script></body></html>
